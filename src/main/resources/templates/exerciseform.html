<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Exercise</title>
</head>
<body>
    <h1>Add Exercise</h1>

    <form th:action="@{/addexercise}" th:object="${exercise}" method="post">
        <div>
            <label for="exerciseName">Exercise name:</label>
            <input id="exerciseName" type="text" th:field="*{exerciseName}" required>
        </div>

        <div>
            <label for="sets">Sets:</label>
            <input id="sets" type="number" th:field="*{sets}" min="1" required>
        </div>

        <div>
            <label for="repsPerSet">Reps per set:</label>
            <input id="repsPerSet" type="number" th:field="*{repsPerSet}" min="1" required>
        </div>

        <div>
            <label for="weightInKg">Weight (kg):</label>
            <input id="weightInKg" type="number" th:field="*{weightInKg}" min="0" step="0.01" required>
        </div>

        <button type="submit">Save Exercise</button>
    </form>

    <a th:href="@{/workouts}">Cancel</a>
</body>
</html>
