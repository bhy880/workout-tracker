<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
    <h1>Login</h1>

    <div th:if="${param.registered}" class="alert alert-success">Account created, you can now log in.</div>
    <div th:if="${param.error}" class="alert alert-danger">Wrong username or password.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have logged out.</div>
    
    <form th:action="@{/login}" method="post">
        <div >
            <label for="username">Username</label>
            <input id="username" name="username" class="form-control" required>
        </div>
        <div >
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <a th:href="@{/workouts}">Workouts</a>
    <a th:href="@{/signup}">Sign up</a>
    <a th:href="@{/oauth2/authorization/github}" class="btn btn-dark">Log in with GitHub</a>
</body>
</html>
