<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
    <h1>Sign up</h1>

    <form th:action="@{/signup}" th:object="${signupForm}" method="post">

        <!-- Server-side errors (username taken, passwords don't match) -->
        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
            <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
        </div>

        <div class="mb-2">
            <label for="username">Username</label>
            <input id="username" th:field="*{username}" class="form-control" min="3" required>
        </div>
        <div class="mb-2">
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" class="form-control" min="3" required>
        </div>
     
        <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <a th:href="@{/login}">Already a user? Log in</a>
</body>
</html>
