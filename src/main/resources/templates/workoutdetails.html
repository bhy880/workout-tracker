<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workout</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">
    <h1 th:text="${workout.workoutName}">Workout</h1>
    <p th:text="${workout.workoutDate}"></p>
    <p>Duration: <span th:text="${workout.durationInMinutes}"></span> min</p>
    <h2>Exercises</h2>
    <table class="table table-striped">
        <tr>
            <th>Exercise</th>
            <th>Sets</th>
            <th>Reps</th>
            <th>Weight (kg)</th>
            <th th:if="${canEdit}"></th>
            <th th:if="${canEdit}"></th>
        </tr>
        <tr th:each="exercise : ${workout.exercises}">
            <td th:text="${exercise.exerciseName}"></td>
            <td th:text="${exercise.sets}"></td>
            <td th:text="${exercise.repsPerSet}"></td>
            <td th:text="${exercise.weightInKg}"></td>
            <td th:if="${canEdit}">
                <a th:href="@{/editexercise/{id}(id=${exercise.id})}" class="btn btn-primary">Edit</a>
            </td>
            <td th:if="${canEdit}">
                <form th:action="@{/deleteexercise/{id}(id=${exercise.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <a th:if="${canEdit}" th:href="@{/addexercise/{wid}(wid=${workout.id})}" class="btn btn-success">Add exercise</a>
    <a th:href="@{/workouts}">Back to list</a>
</body>
</html>
