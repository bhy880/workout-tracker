<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workout</title>
</head>
<body>
    <h1 th:text="${workout.workoutName}">Workout</h1>
    <p th:text="${workout.workoutDate}"></p>
    <p>Duration: <span th:text="${workout.durationInMinutes}"></span> min</p>

    <h2>Exercises</h2>
    <table>
        <tr>
            <th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight (kg)</th><th></th>
        </tr>
        <tr th:each="exercise : ${workout.exercises}">
            <td th:text="${exercise.exerciseName}"></td>
            <td th:text="${exercise.sets}"></td>
            <td th:text="${exercise.repsPerSet}"></td>
            <td th:text="${exercise.weightInKg}"></td>
            <td><a th:href="@{/editexercise/{id}(id=${exercise.id})}">Edit</a></td>
        </tr>
    </table>

    <a th:href="@{/workouts}">Back to list</a>
</body>
</html>
