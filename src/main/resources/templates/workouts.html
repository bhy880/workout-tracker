<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Workouts</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body class="container mt-4">

    <!-- Navigation -->
    <nav class="mb-3">
        <a th:href="@{/workouts}" class="btn btn-link">All workouts</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/myworkouts}" class="btn btn-link">My workouts</a>

        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-primary">Log in</a>
        <span sec:authorize="isAuthenticated()">
            Logged in as <strong sec:authentication="name"></strong>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-secondary">Log out</button>
            </form>
        </span>
    </nav>

    <h1 th:text="${mine} ? 'My workouts' : 'All workouts'">Workouts</h1>

    <table class="table table-striped">
        <tr>
            <th>Name</th>
            <th>Date</th>
            <th>Duration (min)</th>
            <th th:unless="${mine}">Owner</th>
            <th th:if="${mine}"></th>
            <th th:if="${mine}"></th>
        </tr>
        <tr th:each="workout : ${workouts}">
            <td>
                <a th:href="@{/workout/{id}(id=${workout.id})}"
                   th:text="${workout.workoutName}">Name</a>
            </td>
            <td th:text="${workout.workoutDate}"></td>
            <td th:text="${workout.durationInMinutes}"></td>

            <!-- Owner shown only in the public list -->
            <td th:unless="${mine}" th:text="${workout.owner?.username}"></td>

            <!-- Edit/Delete only in My workouts -->
            <td th:if="${mine}">
                <a th:href="@{/editworkout/{id}(id=${workout.id})}" class="btn btn-primary">Edit</a>
            </td>
            <td th:if="${mine}">
                <form th:action="@{/deleteworkout/{id}(id=${workout.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <a th:if="${mine}" th:href="@{/addworkout}" class="btn btn-success">Add workout</a>
</body>
</html>
